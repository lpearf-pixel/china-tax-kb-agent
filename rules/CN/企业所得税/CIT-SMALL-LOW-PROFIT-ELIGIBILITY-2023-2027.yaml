{
  "rule_id": "CIT-SMALL-LOW-PROFIT-ELIGIBILITY-2023-2027",
  "version": 1,
  "status": "effective",
  "valid_from": "2023-01-01",
  "valid_to": "2027-12-31",
  "jurisdiction": "CN",
  "tax_type": "企业所得税",
  "priority": 90,
  "when": {
    "all": [
      {"fact": "cit.resident_status", "operator": "equals", "value": "居民企业"},
      {"fact": "cit.entity_form", "operator": "not_in", "value": ["个人独资企业", "合伙企业"]},
      {"fact": "cit.restricted_industry", "operator": "is_false"},
      {"fact": "cit.estimated_taxable_income", "operator": "less_or_equal", "value": 3000000},
      {"fact": "cit.employee_count_avg", "operator": "less_or_equal", "value": 300},
      {"fact": "cit.asset_total_avg", "operator": "less_or_equal", "value": 50000000}
    ]
  },
  "then": {"outcome": "cit_small_low_profit_eligible", "value": true},
  "requires": [
    "cit.resident_status",
    "cit.entity_form",
    "cit.restricted_industry",
    "cit.estimated_taxable_income",
    "cit.employee_count_avg",
    "cit.asset_total_avg",
    "cit.has_unincorporated_branches"
  ],
  "legal_basis": [
    {"document_id": "DOC-CN-CIT-MOF-STA-2023-12", "provision_id": "PROV-CIT-SME-2023-12"},
    {"document_id": "DOC-CN-CIT-STA-2023-6", "provision_id": "PROV-CIT-SME-ADMIN-2023-6"}
  ],
  "description": "2023至2027年小型微利企业资格条件",
  "tags": ["企业所得税", "小型微利企业", "资格"]
}
