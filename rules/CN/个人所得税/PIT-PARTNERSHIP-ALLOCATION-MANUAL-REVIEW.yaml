{
  "rule_id": "PIT-PARTNERSHIP-ALLOCATION-MANUAL-REVIEW",
  "version": 1,
  "status": "effective",
  "valid_from": "2019-01-01",
  "valid_to": null,
  "jurisdiction": "CN",
  "tax_type": "个人所得税",
  "priority": 120,
  "when": {"all": [
    {"fact": "pit.taxpayer_role", "operator": "equals", "value": "合伙企业自然人合伙人"},
    {"any": [
      {"fact": "pit.partnership_allocated_income_confirmed", "operator": "is_false"},
      {"not": {"fact": "pit.partnership_allocated_income_confirmed", "operator": "exists"}}
    ]}
  ]},
  "then": {"outcome": "pit_manual_review_required", "value": true, "manual_review_required": true, "confidence": "manual_review"},
  "requires": ["pit.taxpayer_role"],
  "legal_basis": [{"document_id": "DOC-CN-PIT-REG-2018", "provision_id": "PROV-PIT-LAW-001-003"}],
  "description": "合伙企业自然人合伙人的经营所得分配资料不足时人工复核",
  "tags": ["个人所得税", "合伙企业", "所得分配", "人工复核"]
}
