name: Verify Tax Knowledge Base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        working-directory: 90-工具
        run: python -m unittest discover -s tests -v

      - name: Validate Vault metadata and links
        working-directory: 90-工具
        run: python taxkb_validate.py --report /tmp/taxkb-validation.md

      - name: Build clause-aware index
        working-directory: 90-工具
        run: python taxkb_export.py --profile full --output /tmp/taxkb-chunks.jsonl

      - name: Run retrieval regression benchmark
        working-directory: 90-工具
        run: >-
          python taxkb_eval.py
          --chunks /tmp/taxkb-chunks.jsonl
          --report /tmp/taxkb-eval.md
