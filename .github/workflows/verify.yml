name: Verify Tax Knowledge Base

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.2.2 verified commit.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Show Python version
        run: python3 --version

      - name: Compile Python sources
        run: python3 -m compileall -q apps 90-工具

      - name: TaxKB and legal-content tests
        run: python3 -m unittest discover -s 90-工具/tests -v

      - name: V7 and V7.2 decision-core tests
        run: python3 -m unittest discover -s apps/tax_decision_core/tests -v

      - name: V7.1 retrieval tests
        run: python3 -m unittest discover -s apps/tax_retrieval/tests -v

      - name: Run V7.2.1 workbench tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s apps/tax_workbench/tests -v > /tmp/v721-workbench.log 2>&1
          echo "$?" > /tmp/v721-workbench.status
          exit 0

      - name: Upload V7.2.1 workbench diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v721-workbench-diagnostics
          path: |
            /tmp/v721-workbench.log
            /tmp/v721-workbench.status
          if-no-files-found: error
          retention-days: 3

      - name: Enforce workbench test result
        shell: bash
        run: |
          status="$(cat /tmp/v721-workbench.status)"
          if [ "$status" -ne 0 ]; then
            tail -n 160 /tmp/v721-workbench.log
          else
            cat /tmp/v721-workbench.log
          fi
          exit "$status"

      - name: Validate Vault metadata and links
        run: python3 90-工具/taxkb_validate.py --report /tmp/taxkb-validation.md

      - name: Build clause-aware index
        run: python3 90-工具/taxkb_export.py --profile full --output /tmp/taxkb-chunks.jsonl

      - name: Run original retrieval regression benchmark
        run: >-
          python3 90-工具/taxkb_eval.py
          --chunks /tmp/taxkb-chunks.jsonl
          --report /tmp/taxkb-eval.md
