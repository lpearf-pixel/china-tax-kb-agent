<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国税务决策工作台 V7.2.1</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#132238}header{background:#102a43;color:#fff;padding:24px max(20px,calc((100vw - 1520px)/2))}header h1{margin:0 0 6px;font-size:27px}header p{margin:0;opacity:.82}main{max-width:1520px;margin:18px auto;padding:0 16px 50px;display:grid;grid-template-columns:410px 1fr;gap:16px}.panel{background:#fff;border:1px solid #d8e2ec;border-radius:12px;padding:17px;box-shadow:0 7px 22px rgba(16,42,67,.06)}h2,h3,h4{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:13px;font-weight:650;margin:9px 0 4px}input,select,textarea{width:100%;padding:8px 9px;border:1px solid #bcccdc;border-radius:7px;background:#fff;color:#132238}textarea{min-height:70px;resize:vertical}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.check-grid label,.tax-select label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}.check-grid input,.tax-select input{width:auto}.tax-select{display:flex;gap:14px;flex-wrap:wrap;padding:9px;border:1px solid #bcccdc;border-radius:8px}.subpanel{margin-top:13px;padding:12px;border:1px solid #d8e2ec;border-radius:9px;background:#f8fafc}.hidden{display:none}.primary,.secondary{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{width:100%;margin-top:13px;background:#117f9c;color:#fff}.secondary{background:#e7eef5;color:#102a43}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.actions button:disabled{opacity:.45}.notice{padding:12px;border-radius:9px;background:#fff8e1;border:1px solid #efc467;line-height:1.55}.danger{background:#fff0f0;border-color:#e57373}.section{border-top:1px solid #d8e2ec;margin-top:17px;padding-top:15px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.card{border:1px solid #d8e2ec;border-radius:9px;padding:12px;background:#fbfcfe;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e3f2fd;font-size:12px;font-weight:700;margin-right:5px}.review{background:#ffebee;color:#a52727}.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin:8px 0}.amount{padding:8px;border-radius:7px;background:#edf4f8}.muted{font-size:12px;color:#627d98}pre{white-space:pre-wrap;background:#102a43;color:#eef6fb;padding:9px;border-radius:7px;font-size:12px}details{margin:7px 0}summary{cursor:pointer;font-weight:700}#empty{text-align:center;color:#829ab1;padding:70px 15px}@media(max-width:960px){main{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){body{background:#101820;color:#e7edf3}.panel,.card{background:#17222d;border-color:#32475a}.subpanel{background:#111b24;border-color:#32475a}input,select,textarea{background:#101820;color:#e7edf3;border-color:#486581}.amount{background:#243746}.secondary{background:#32475a;color:#fff}}
</style>
</head>
<body>
<header><h1>中国税务决策工作台 V7.2.1</h1><p>增值税 + 企业所得税 + 个人所得税｜经营所得、劳务报酬预扣、综合方案与人工审签</p></header>
<main>
<section class="panel">
<h2>案件事实</h2>
<form id="facts-form">
<label>分析税种</label><div class="tax-select"><label><input type="checkbox" class="tax-type" value="增值税" checked>增值税</label><label><input type="checkbox" class="tax-type" value="企业所得税">企业所得税</label><label><input type="checkbox" class="tax-type" value="个人所得税">个人所得税</label></div>
<div class="row"><div><label>业务日期</label><input name="business_date" type="date" value="2026-07-19" required></div><div><label>地区</label><select name="region"><option value="CN-XJ">新疆</option><option value="CN-HI">海南</option><option value="CN">全国/其他</option></select></div></div>
<div class="row"><div><label>主体类型</label><select name="taxpayer_type"><option>企业</option><option>个体工商户</option><option>自然人</option><option>其他组织</option></select></div><div><label>增值税身份</label><select name="vat_status"><option>小规模纳税人</option><option>一般纳税人</option><option>未知</option></select></div></div>
<div class="row"><div><label>交易类型</label><select name="transaction_type"><option>服务</option><option>货物</option><option>无形资产</option><option>不动产</option><option>进口货物</option><option>其他</option></select></div><div><label>计税期间</label><select name="amount_period"><option>季度</option><option>月</option><option>单次</option><option>年度</option></select></div></div>
<div class="row"><div><label>交易额</label><input name="amount" type="number" min="0" step="0.01" value="240000"></div><div><label>同期间销售额</label><input name="total_sales_same_period" type="number" min="0" step="0.01" value="240000"></div></div>
<div class="row"><div><label>原征收率</label><input name="original_levy_rate" type="number" step="0.01" value="0.03"></div><div><label>连续期间销售额</label><input name="rolling_sales" type="number" step="0.01"></div></div>
<div class="row"><div><label>发票需求</label><select name="invoice_need"><option>普通发票</option><option>专用发票</option><option>不确定</option><option>无需发票</option></select></div><div><label>规划目标</label><select name="objective"><option>合规降负</option><option>综合税负</option><option>企业所得税测算</option><option>个人所得税测算</option><option>现金流优化</option><option>海南政策预审</option></select></div></div>
<label>真实业务描述</label><textarea name="description">提供咨询服务</textarea>
<div class="check-grid"><label><input type="checkbox" name="amount_tax_inclusive">金额含税</label><label><input type="checkbox" name="waive_exemption">放弃免税</label><label><input type="checkbox" name="related_party">关联交易</label><label><input type="checkbox" name="split_signal">分拆信号</label><label><input type="checkbox" name="cross_border">跨境业务</label><label><input type="checkbox" name="restructuring">企业重组</label><label><input type="checkbox" name="real_estate">房地产事项</label><label><input type="checkbox" name="hainan_special_scene">海南特殊场景</label></div>
<div class="row"><div><label>海南 HS 编码</label><input name="hs_code"></div><div><label>海南享惠主体</label><select name="qualified_entity"><option value="">未确认</option><option value="true">是</option><option value="false">否</option></select></div></div>
<div id="cit-panel" class="subpanel hidden"><h3>企业所得税事实</h3>
<div class="row"><div><label>实体形式</label><select name="entity_form"><option value="">请选择</option><option>公司制企业</option><option>个人独资企业</option><option>合伙企业</option><option>其他组织</option></select></div><div><label>居民身份</label><select name="cit_resident_status"><option value="">请选择</option><option>居民企业</option><option>非居民企业</option><option>未知</option></select></div></div>
<div class="row"><div><label>会计利润</label><input name="cit_accounting_profit" type="number" step="0.01"></div><div><label>纳税调增</label><input name="cit_adjustment_increase" type="number" step="0.01" value="0"></div></div>
<div class="row"><div><label>纳税调减</label><input name="cit_adjustment_decrease" type="number" step="0.01" value="0"></div><div><label>可弥补亏损</label><input name="cit_loss_carryforward" type="number" step="0.01" value="0"></div></div>
<div class="row"><div><label>税额抵免</label><input name="cit_tax_credit" type="number" step="0.01" value="0"></div><div><label>已预缴税额</label><input name="cit_prepaid_tax" type="number" step="0.01" value="0"></div></div>
<div class="row"><div><label>季度平均从业人数</label><input name="cit_employee_count_avg" type="number" step="0.01"></div><div><label>季度平均资产总额</label><input name="cit_asset_total_avg" type="number" step="0.01"></div></div>
<div class="check-grid"><label><input type="checkbox" name="cit_restricted_industry">限制/禁止行业</label><label><input type="checkbox" name="cit_has_unincorporated_branches">存在非法人分支机构</label></div></div>
<div id="pit-panel" class="subpanel hidden"><h3>个人所得税事实</h3>
<div class="row"><div><label>所得类别</label><select name="pit_income_category"><option value="">请选择</option><option>经营所得</option><option>劳务报酬</option></select></div><div><label>居民身份</label><select name="pit_resident_status"><option value="">请选择</option><option>居民个人</option><option>非居民个人</option><option>未知</option></select></div></div>
<label>纳税人角色</label><select name="pit_taxpayer_role"><option value="">请选择</option><option>个体工商户业主</option><option>个人独资企业投资者</option><option>合伙企业自然人合伙人</option><option>独立劳务个人</option></select>
<div id="pit-business"><div class="row"><div><label>全年经营所得应纳税所得额</label><input name="pit_business_taxable_income" type="number" step="0.01"></div><div><label>其他个人所得税减免</label><input name="pit_business_other_tax_reduction" type="number" step="0.01" value="0"></div></div><div class="row"><div><label>已预缴经营所得税</label><input name="pit_business_prepaid_tax" type="number" step="0.01" value="0"></div><div></div></div><div class="check-grid"><label><input type="checkbox" name="pit_multiple_business_sources">存在多处经营所得</label><label><input type="checkbox" name="pit_business_income_aggregated">已按多处经营合并</label><label><input type="checkbox" name="pit_partnership_allocated_income_confirmed">合伙分配所得已确认</label></div></div>
<div id="pit-labor" class="hidden"><div class="row"><div><label>本次/月劳务报酬收入</label><input name="pit_labor_gross_income" type="number" step="0.01"></div><div><label>已预扣税额</label><input name="pit_labor_withheld_tax" type="number" step="0.01" value="0"></div></div><div class="check-grid"><label><input type="checkbox" name="pit_labor_is_continuous_service">连续性劳务按月合并</label><label><input type="checkbox" name="pit_labor_payer_has_withholding_obligation">支付方承担扣缴义务</label></div></div></div>
<button class="primary" type="submit">运行 V7.2.1 多税种分析</button>
</form></section>
<section class="panel"><div class="actions"><button id="save" class="secondary" disabled>建立案件并保存</button><button id="refresh" class="secondary" disabled>刷新案件</button><button id="audit" class="secondary" disabled>查看审计</button></div><div id="empty">选择税种并填写事实后开始分析。</div><div id="result" class="hidden"></div></section>
</main>
<script>
const form=document.querySelector('#facts-form'),citPanel=document.querySelector('#cit-panel'),pitPanel=document.querySelector('#pit-panel'),pitBusiness=document.querySelector('#pit-business'),pitLabor=document.querySelector('#pit-labor'),pitCategory=form.elements.pit_income_category,empty=document.querySelector('#empty'),result=document.querySelector('#result'),saveBtn=document.querySelector('#save'),refreshBtn=document.querySelector('#refresh'),auditBtn=document.querySelector('#audit');let lastFacts=null,currentCase='';
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function list(rows){return `<ul>${(rows||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function selectedTax(name){return [...document.querySelectorAll('.tax-type:checked')].some(x=>x.value===name)}
function updatePanels(){citPanel.classList.toggle('hidden',!selectedTax('企业所得税'));pitPanel.classList.toggle('hidden',!selectedTax('个人所得税'));const labor=pitCategory.value==='劳务报酬';pitLabor.classList.toggle('hidden',!labor);pitBusiness.classList.toggle('hidden',labor)}document.querySelectorAll('.tax-type').forEach(x=>x.addEventListener('change',updatePanels));pitCategory.addEventListener('change',updatePanels);
function facts(){const data=Object.fromEntries(new FormData(form).entries());data.requested_tax_types=[...document.querySelectorAll('.tax-type:checked')].map(x=>x.value);for(const el of form.querySelectorAll('input[type=checkbox]:not(.tax-type)'))data[el.name]=el.checked;data.qualified_entity=data.qualified_entity===''?null:data.qualified_entity==='true';return data}
async function call(path,payload,method='POST'){const o={method,headers:{'Content-Type':'application/json'}};if(payload!==undefined)o.body=JSON.stringify(payload);const r=await fetch(path,o),d=await r.json();if(!r.ok)throw new Error((d.errors||[d.error||'请求失败']).join('\n'));return d}
function typed(v){return v&&typeof v==='object'&&v.value!==undefined?v.value:(v??'')}
function render(d){currentCase=d.case_id||currentCase;const calcs=(d.calculations||[]).map(c=>`<div class="card"><h4>${esc(c.tax_type)} · ${esc(c.calculation_id)}</h4><div class="muted">${esc(c.status)}</div><p>计税基础：${esc(typed(c.taxable_amount))}<br>税额：${esc(typed(c.tax_amount))}<br>应补退/留抵/补扣：${esc(typed(c.payable_or_credit))}</p><pre>${esc(c.formula||'')}</pre></div>`).join('');const schemes=(d.schemes||[]).map(s=>`<div class="card"><h4>${esc(s.name)}</h4><span class="pill">综合金额 ${esc(s.estimated_tax)}</span><p>${esc(s.summary)}</p><div class="breakdown">${Object.entries(s.tax_breakdown||{}).map(([k,v])=>`<div class="amount"><strong>${esc(k)}</strong><br>${esc(v)}</div>`).join('')||'<div class="muted">无分项</div>'}</div><strong>执行动作</strong>${list(s.actions)}<strong>风险</strong>${list(s.risks)}</div>`).join('');result.innerHTML=`<div><span class="pill ${d.human_review_required?'review':''}">${d.human_review_required?'必须人工审签':'可继续评估'}</span><span class="pill">${esc(d.case_state||'stateless')}</span></div><h2>分析结果</h2><div class="notice ${d.human_review_required?'danger':''}">${esc(d.initial_conclusion)}</div><p>${esc(d.regional_application)}</p>${d.missing_facts?.length?`<div class="section"><h3>待补事实</h3>${list(d.missing_facts)}</div>`:''}<div class="section"><h3>税额/预扣计算</h3><div class="cards">${calcs}</div></div><div class="section"><h3>综合方案</h3><div class="cards">${schemes}</div></div><div class="section"><h3>法规与审计</h3><details><summary>规则轨迹</summary><pre>${esc(JSON.stringify(d.rule_trace||[],null,2))}</pre></details><details><summary>证据分组</summary><pre>${esc(JSON.stringify(d.evidence_groups||{},null,2))}</pre></details></div>`;empty.classList.add('hidden');result.classList.remove('hidden');saveBtn.disabled=false;refreshBtn.disabled=!currentCase;auditBtn.disabled=!currentCase}
form.addEventListener('submit',async e=>{e.preventDefault();lastFacts=facts();if(!lastFacts.requested_tax_types.length){alert('至少选择一个税种');return}currentCase='';empty.classList.remove('hidden');empty.textContent='正在检索法规、执行分税种规则并计算…';result.classList.add('hidden');try{render(await call('/api/analyze',lastFacts))}catch(err){empty.textContent=err.message}});
saveBtn.addEventListener('click',async()=>{if(!lastFacts)return;try{const d=await call('/api/save',lastFacts);render(d);alert(`案件 ${d.case_id} 已保存`)}catch(e){alert(e.message)}});refreshBtn.addEventListener('click',async()=>{if(currentCase)try{render(await call(`/api/cases/${currentCase}/analyze`,{}))}catch(e){alert(e.message)}});auditBtn.addEventListener('click',async()=>{if(currentCase)try{const d=await call(`/api/cases/${currentCase}/audit`,undefined,'GET');alert(JSON.stringify(d.events||[],null,2))}catch(e){alert(e.message)}});updatePanels();
</script></body></html>
